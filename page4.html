
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unlimited Love & Kisses 💋</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    overflow: hidden;
    font-family: 'Arial', sans-serif;

    /* Same love-delivery background style */
    background: linear-gradient(135deg, #ffb6c1, #ff69a6, #ff4d6d);
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    position: relative;
    z-index: 2;
    text-align: center;
    width: 90%;
    max-width: 600px;
    padding: 35px 20px;
    border-radius: 30px;
    background: rgba(255, 255, 255, 0.18);
    border: 2px solid rgba(255, 255, 255, 0.5);
    box-shadow: 0 10px 40px rgba(180, 0, 70, 0.2);
    backdrop-filter: blur(5px);
}

.tag {
    display: inline-block;
    background: white;
    color: #ff3678;
    padding: 10px 18px;
    border-radius: 30px;
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 1px;
    margin-bottom: 22px;
}

.big-kiss {
    font-size: 55px;
    margin-bottom: 15px;
    animation: pulse 1.3s infinite;
}

h1 {
    color: white;
    font-size: clamp(32px, 7vw, 52px);
    line-height: 1.2;
    text-shadow: 2px 4px 12px rgba(180, 0, 70, 0.3);
}

h1 span {
    color: #fff0f5;
}

p {
    color: white;
    font-size: 17px;
    line-height: 1.8;
    margin-top: 22px;
}

.falling {
    position: fixed;
    top: -60px;
    z-index: 1;
    pointer-events: none;
    animation: rain linear forwards;
}

@keyframes rain {
    0% {
        transform: translateY(-5vh) rotate(0deg);
        opacity: 1;
    }
    100% {
        transform: translateY(115vh) rotate(360deg);
        opacity: 0.85;
    }
}

@keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.15); }
}
</style>
</head>

<body>

<div class="container">
    <div class="tag">OFFICIAL LOVE DELIVERY 💌</div>

    <div class="big-kiss">💋❤️😘</div>

    <h1>
        UNLIMITED<br>
        <span>LOVE & KISSES</span>
    </h1>

    <p>
        Okay, baby... enough suspense. 🥹💕
        <br>
        Now it's time for your daily dose of Anushka's love.
    </p>
</div>

<script>
const emojis = ["💋", "❤️", "💕", "💖", "😘", "💗", "💞"];

function makeRain() {
    const item = document.createElement("div");
    item.className = "falling";
    item.textContent = emojis[Math.floor(Math.random() * emojis.length)];

    item.style.left = Math.random() * 100 + "vw";
    item.style.fontSize = (20 + Math.random() * 25) + "px";
    item.style.animationDuration = (3 + Math.random() * 4) + "s";

    document.body.appendChild(item);

    setTimeout(() => item.remove(), 7500);
}

setInterval(makeRain, 100);

for (let i = 0; i < 40; i++) {
    setTimeout(makeRain, i * 60);
}
</script>

</body>

<button class="next-button" onclick="window.location.href='page5.html'">
    One More Surprise, Baby 💋❤️
</button>

<style>
.next-button {
    position: fixed;
    bottom: 25px;
    right: 20px;
    z-index: 100;
    background: linear-gradient(135deg, #ff4f87, #ff8fab);
    color: white;
    border: 2px solid white;
    border-radius: 30px;
    padding: 14px 20px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 5px 15px #ff367855;
}
.next-button:hover {
    transform: scale(1.08);
}
</style>

</html>
