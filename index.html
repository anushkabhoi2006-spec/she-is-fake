
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Secret About Anushka 🖤</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
      background: radial-gradient(circle, #241019, #080808 75%);
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .container {
      width: 100%;
      max-width: 650px;
    }

    .tag {
      color: #ff477e;
      font-size: 12px;
      letter-spacing: 4px;
      line-height: 1.8;
    }

    h1 {
      font-size: clamp(35px, 8vw, 58px);
      line-height: 1.2;
      margin: 28px 0;
    }

    h1 span {
      color: #ff477e;
    }

    p {
      color: #c9c1c5;
      line-height: 1.8;
      margin: 20px 0;
      font-size: 16px;
    }

    .box {
      margin: 30px 0;
      padding: 25px 15px;
      background: #ffffff08;
      border: 1px solid #633044;
      border-radius: 18px;
      box-shadow: 0 0 35px #ff174415;
    }

    button {
      padding: 16px 25px;
      width: 100%;
      max-width: 340px;
      border: none;
      border-radius: 30px;
      background: linear-gradient(90deg, #ff477e, #ff1744);
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 25px #ff174455;
      transition: transform 0.2s;
    }

    button:hover {
      transform: scale(1.04);
    }

    .small {
      margin-top: 35px;
      color: #857780;
      font-size: 11px;
      letter-spacing: 3px;
    }
  </style>
</head>

<body>
  <div class="container">

    <div class="tag">
      U THINK SHE IS WHAT SHE LOOKS LIKE?
    </div>

    <h1>
      She's hiding<br>
      <span>things from you...</span>
    </h1>

    <p>
      You got one of her secrets by accident.<br>
      What about the others? 👀
    </p>

    <div class="box">
      <p>
        Do you think she really loves you, or...?
      </p>

      <p>
        You deserve to know the truth. 🖤
      </p>

      <button onclick="goToTruth()">
        YOU NEED TO KNOW THIS →
      </button>
    </div>

    <div class="small">
      SOME SECRETS CHANGE EVERYTHING...
    </div>

  </div>

  <script>
    function goToTruth() {
      window.location.href = "page2.html";
    }
  </script>
</body>
</html>
