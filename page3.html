
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Truth ❤️</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
      font-family: Arial, sans-serif;
      text-align: center;
      color: #fff;
      background: radial-gradient(circle, #50152f, #140711 75%);
      overflow: hidden;
    }

    .container {
      max-width: 650px;
      width: 100%;
      animation: reveal 1.5s ease;
      position: relative;
      z-index: 2;
    }

    .tag {
      color: #ff9ac2;
      letter-spacing: 5px;
      font-size: 12px;
    }

    .emoji {
      font-size: 75px;
      margin: 25px 0;
      animation: heartbeat 1s infinite;
    }

    h1 {
      font-size: clamp(38px, 9vw, 68px);
      line-height: 1.15;
      margin: 25px 0;
    }

    h1 span {
      color: #ff8cbb;
    }

    p {
      font-size: 17px;
      color: #f3dce8;
      line-height: 1.9;
      margin: 20px 0;
    }

    .card {
      background: #ffffff0c;
      border: 1px solid #ff8cbb66;
      border-radius: 25px;
      padding: 30px 20px;
      margin: 25px 0;
      box-shadow: 0 0 45px #ff4d9820;
    }

    .love {
      font-size: 48px;
      margin: 15px 0;
    }

    button {
      padding: 16px 24px;
      width: 100%;
      max-width: 330px;
      border: none;
      border-radius: 30px;
      background: linear-gradient(90deg, #ff4d98, #ff1744);
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 25px #ff174444;
      transition: 0.25s;
    }

    button:hover {
      transform: scale(1.05);
    }

    .heart {
      position: fixed;
      bottom: -50px;
      animation: floatUp linear forwards;
      pointer-events: none;
      z-index: 1;
    }

    @keyframes reveal {
      from { opacity: 0; transform: scale(.8); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }

    @keyframes floatUp {
      to {
        transform: translateY(-120vh) rotate(25deg);
        opacity: 0;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="tag">THE TRUTH HAS BEEN REVEALED</div>

    <div class="emoji">🥁❤️</div>

    <h1>
      SURPRISE,<br>
      <span>YOU IDIOT! 😂</span>
    </h1>

    <div class="card">

      <div class="love">🥹💗😘</div>

      <h1 style="font-size:clamp(28px,7vw,45px)">
        IT WAS <span>YOU</span><br>
        ALL ALONG!
      </h1>

      <p>
        BABYYYY 😭❤️
        <br><br>
        Did you really think your Anushka
        could replace you? 😂
        <br><br>
        You are my favourite person,
        my happiness, and my favourite headache. 🤭
        <br><br>
        THIS WHOLE THING WAS A PRANK!
      </p>

      <div class="love">💋💋💋</div>

    </div>

    <button onclick="goToLove()">
      NOW COME GET YOUR KISSES 💋 →
    </button>

    <p style="font-size:12px;color:#d3a9be">
      I LOVE YOU MORE THAN YOU KNOW ❤️
    </p>

  </div>

  <script>
    function makeHeart() {
      const heart = document.createElement("div");
      const emojis = ["❤️", "💗", "💕", "💋", "😘", "🩷"];

      heart.className = "heart";
      heart.textContent =
        emojis[Math.floor(Math.random() * emojis.length)];

      heart.style.left = Math.random() * 100 + "vw";
      heart.style.fontSize = (20 + Math.random() * 25) + "px";
      heart.style.animationDuration = (3 + Math.random() * 4) + "s";

      document.body.appendChild(heart);

      setTimeout(() => heart.remove(), 7000);
    }

    setInterval(makeHeart, 350);

    function goToLove() {
      window.location.href = "page4.html";
    }
  </script>

</body>
</html>
